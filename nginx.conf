# Next.js Nginx configuration (HTTP only - SSL will be added via Certbot)

upstream nextjs_upstream {
    # Next.js server runs on localhost:1338 (configured in website/ecosystem.config.js)
    server 127.0.0.1:1338;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;

    # Replace with your actual domain name(s)
    server_name primeqasolutions.com;

    # Root directory of the Next.js project (update if running directly on the server)
    # root /var/www/primeqa-website;

    # Disable server tokens (security best practice)
    server_tokens off;

    # Log files (adjust paths as needed)
    access_log /var/log/nginx/primeqa_access.log;
    error_log /var/log/nginx/primeqa_error.log warn;

    # Gzip Compression settings
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/plain
        text/vcard
        text/vnd.rim.location.code
        text/vtt
        text/x-component
        text/x-cross-domain-policy;

    # ACME-challenge location for Let's Encrypt / Certbot SSL validation
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # Serve Next.js static chunks DIRECTLY from disk — bypasses Node.js entirely.
    # Content-addressed hashed filenames make these safe to cache forever.
    # This is the key fix for PageSpeed "Render-Blocking Requests" on _next/static/chunks/*.css
    # location /_next/static/ {
    #     alias /var/www/primeqa-website/.next/static/;

    #     expires 365d;
    #     add_header Cache-Control "public, max-age=31536000, immutable";
    #     add_header X-Content-Type-Options "nosniff";
    #     access_log off;
    # }

    location /_next/static/ {
        alias /home/ubuntu/primeqa/.next/static/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }
    # # Serve public/ static files directly (images, icons, robots, sitemap, webfonts)
    # location ~* ^/.*\.(?:jpg|jpeg|gif|png|ico|svg|webp|woff|woff2|ttf|eot)$ {
    #     root /var/www/primeqa-website/public;
    #     try_files $uri @nextjs;
    #     expires 30d;
    #     add_header Cache-Control "public, max-age=2592000, must-revalidate";
    #     access_log off;
    # }

    location ~* ^/.*\.(?:jpg|jpeg|gif|png|ico|svg|webp|woff|woff2|ttf|eot)$ {
        root /home/ubuntu/primeqa/public;
        try_files $uri @nextjs;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, must-revalidate";
        access_log off;
    }
    # Fallback to Next.js if file not found in public/
    location @nextjs {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # Main application location - proxy everything else to the Next.js server
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;

        # Standard headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upgrade headers for WebSockets / Next.js Fast Refresh
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
